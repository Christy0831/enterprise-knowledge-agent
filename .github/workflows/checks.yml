name: checks
on: [push, pull_request]
jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/check.py
      - run: python run.py evaluate --provider mock
      - run: python scripts/demo_hybrid.py
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: |
            examples/test-results.*
            examples/mock/
            examples/hybrid/
